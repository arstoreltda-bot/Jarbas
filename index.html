<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">

<meta name="description" content="Jarbas, seu assistente pessoal: agenda, lembretes e conversa por voz.">

<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 896px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-828x1792.png">

<link rel="apple-touch-startup-image" media="(device-width: 393px) and (device-height: 852px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1179x2556.png">
<link rel="apple-touch-startup-image" media="(device-width: 390px) and (device-height: 844px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1170x2532.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 812px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1125x2436.png">
<link rel="apple-touch-startup-image" media="(device-width: 414px) and (device-height: 736px) and (-webkit-device-pixel-ratio: 3) and (orientation: portrait)" href="splash/splash-1242x2208.png">
<link rel="apple-touch-startup-image" media="(device-width: 375px) and (device-height: 667px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-750x1334.png">
<link rel="apple-touch-startup-image" media="(device-width: 320px) and (device-height: 568px) and (-webkit-device-pixel-ratio: 2) and (orientation: portrait)" href="splash/splash-640x1136.png">
<link rel="stylesheet" href="styles.css?v=14">
</head>
<body>
<div id="app">
  <header class="topo">
    <div class="orbe" id="orbe" aria-hidden="true"><i></i></div>
    <div class="nome">
      <h1>Jarbas</h1>
      <span id="estado" aria-live="polite">Pronto</span>
    </div>
    <button class="icone" id="btn-voz" type="button" aria-label="Voz do Jarbas ligada" aria-pressed="true">
      <svg viewBox="0 0 24 24"><path d="M4 9v6h4l5 4V5L8 9z"/><path class="onda" d="M16 9a4 4 0 0 1 0 6M18.5 6.5a7.5 7.5 0 0 1 0 11"/><path class="mudo" d="M17 9l5 6M22 9l-5 6"/></svg>
    </button>
  </header>

  <div id="aviso" class="aviso" role="alert" hidden>
    <div class="aviso-txt"><b id="aviso-t"></b><span id="aviso-s"></span></div>
    <button class="btn" id="aviso-ok" type="button">Ok</button>
  </div>

  <main id="main">
    <section id="tela-conversa" class="tela" aria-label="Conversa"><div id="chat" aria-live="polite"></div></section>
    <section id="tela-agenda" class="tela" aria-label="Agenda" hidden><div id="agenda"></div></section>
    <section id="tela-ajustes" class="tela" aria-label="Ajustes" hidden><div id="ajustes"></div></section>
  </main>

  <footer id="compositor">
    <div class="sugestoes" id="sugestoes">
      <button class="chip" type="button">Marca dentista sexta às 15h</button>
      <button class="chip" type="button">O que eu tenho essa semana?</button>
      <button class="chip" type="button">Reunião da loja amanhã às 9h</button>
    </div>
    <form id="form" autocomplete="off">
      <textarea id="entrada" rows="1" placeholder="Fale ou escreva, senhor…" aria-label="Mensagem para o Jarbas" enterkeyhint="send"></textarea>
      <button class="acao" id="btn-acao" type="button" aria-label="Falar com o Jarbas">
        <svg class="i-mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
        <svg class="i-enviar" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </form>
  </footer>

  <nav class="abas" id="abas" aria-label="Seções">
    <button type="button" data-tela="conversa" aria-current="page"><svg viewBox="0 0 24 24"><path d="M20 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2z"/></svg><span>Conversa</span></button>
    <button type="button" data-tela="agenda"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M16 3v4M8 3v4M3 10h18"/></svg><span>Agenda</span><b class="contador" id="contador" hidden></b></button>
    <button type="button" data-tela="ajustes"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Ajustes</span></button>
  </nav>
</div>

<!-- escutando -->
<div id="escuta" class="escuta" hidden>
  <div class="escuta-caixa">
    <button class="orbe grande" id="escuta-orbe" type="button" aria-label="Enviar o que eu disse"><i></i><em></em></button>
    <p id="escuta-txt">Ouvindo, senhor…</p>
    <div class="botoes">
      <button class="btn" id="escuta-cancelar" type="button">Cancelar</button>
      <button class="btn primario" id="escuta-enviar" type="button">Enviar</button>
    </div>
  </div>
</div>

<!-- folha (formulários) -->
<div id="folha" class="folha" hidden>
  <div class="folha-fundo" id="folha-fundo"></div>
  <div class="folha-caixa" role="dialog" aria-modal="true" aria-labelledby="folha-t">
    <div class="folha-topo"><h2 id="folha-t"></h2><button class="icone" id="folha-x" type="button" aria-label="Fechar"><svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>
    <div id="folha-corpo"></div>
  </div>
</div>

<!-- primeira vez -->
<div id="inicio" class="inicio" hidden></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="js/util.js?v=14"></script>
<script src="js/gemini.js?v=14"></script>
<script src="js/voz.js?v=14"></script>
<script src="js/agenda.js?v=14"></script>
<script src="js/avisos.js?v=14"></script>
<script src="js/financas.js?v=14"></script>
<script src="js/cerebro.js?v=14"></script>
<script src="js/app.js?v=14"></script>
</body>
</html>
